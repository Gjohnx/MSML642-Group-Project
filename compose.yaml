services:
  demo:
    profiles: ["demo"]
    build:
      context: .
      target: runtime
    network_mode: "service:sim"
    ipc: "service:sim"
    depends_on:
      - sim
      - viewer
    init: true
    environment:
      PYTHONPATH: /project
      GZ_PARTITION: msml642
      EXPLORE_TABLE: ${EXPLORE_TABLE:-rule}
      CHASE_TABLE: ${CHASE_TABLE:-rule}
    volumes:
      - ./sim:/project/sim:ro
      - ./rl:/project/rl:ro
      - ./experiments:/project/experiments
    working_dir: /project
    command:
      - bash
      - -c
      - >-
        source /opt/ros/jazzy/setup.bash && python3 -m rl.demo --interactive
        --explore-table "$${EXPLORE_TABLE:-rule}" --chase-table "$${CHASE_TABLE:-rule}"

  sim:
    ipc: shareable
    build:
      context: .
      target: runtime
    init: true
    environment:
      PYTHONPATH: /project
      GZ_PARTITION: msml642
      LIBGL_ALWAYS_SOFTWARE: "1"
    volumes:
      - ./sim:/project/sim:ro
      - ./rl:/project/rl:ro
      - ./analysis:/project/analysis:ro
      - ./docs:/project/docs
      - ./experiments:/project/experiments
    working_dir: /project/sim
    command: ["bash", "run.sh"]

  viewer:
    profiles: ["gui", "demo"]
    build:
      context: .
      target: viewer
    depends_on:
      - sim
    init: true
    environment:
      GAZEBO_DEMO_VIEW: ${GAZEBO_DEMO_VIEW:-0}
      DISPLAY: ":99"
      GZ_PARTITION: msml642
      LIBGL_ALWAYS_SOFTWARE: "1"
      QT_X11_NO_MITSHM: "1"
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - ./sim:/project/sim:ro
      - ./experiments:/project/experiments
    working_dir: /project/sim
    command: ["bash", "view.sh"]

  desktop:
    profiles: ["desktop"]
    build:
      context: .
      target: viewer
    depends_on:
      - sim
    init: true
    environment:
      DISPLAY: ":0"
      GZ_PARTITION: msml642
      LIBGL_ALWAYS_SOFTWARE: "1"
      QT_X11_NO_MITSHM: "1"
    volumes:
      - ./sim:/project/sim:ro
      - type: bind
        source: /mnt/host/wslg/.X11-unix
        target: /tmp/.X11-unix
        read_only: true
        bind:
          create_host_path: false
    working_dir: /project/sim
    command: ["bash", "gui.sh"]
