services:
  sim:
    build:
      context: .
      target: runtime
    init: true
    environment:
      GZ_PARTITION: msml642
      LIBGL_ALWAYS_SOFTWARE: "1"
    volumes:
      - ./sim:/project/sim:ro
      - ./rl:/project/rl:ro
      - ./experiments:/project/experiments
    working_dir: /project/sim
    command: ["bash", "run.sh"]

  viewer:
    profiles: ["gui"]
    build:
      context: .
      target: viewer
    depends_on:
      - sim
    init: true
    environment:
      DISPLAY: ":99"
      GZ_PARTITION: msml642
      LIBGL_ALWAYS_SOFTWARE: "1"
      QT_X11_NO_MITSHM: "1"
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - ./sim:/project/sim:ro
    working_dir: /project/sim
    command: ["bash", "view.sh"]

  desktop:
    profiles: ["desktop"]
    build:
      context: .
      target: viewer
    depends_on:
      - sim
    init: true
    environment:
      DISPLAY: ":0"
      GZ_PARTITION: msml642
      LIBGL_ALWAYS_SOFTWARE: "1"
      QT_X11_NO_MITSHM: "1"
    volumes:
      - ./sim:/project/sim:ro
      - type: bind
        source: /mnt/host/wslg/.X11-unix
        target: /tmp/.X11-unix
        read_only: true
        bind:
          create_host_path: false
    working_dir: /project/sim
    command: ["bash", "gui.sh"]
